<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <link rel="stylesheet" href="inscriptionp.css">
</head>

<body>
   

    <div class="container">
        
        <h2>Créer un compte</h2>

        <form id="formInscription">

            <input type="text" id="nom" placeholder="Nom complet">

            <input type="email" id="email" placeholder="Adresse email">

            <input type="password" id="password" placeholder="Mot de passe">

            <input type="password" id="confirm" placeholder="Confirmer le mot de passe">

            <button type="submit" class="button">S'inscrire</button>
            <p>Vous avez deja un compte ?
                <a href="connexion.html">Se connecter</a>
            </p>

        </form>

        <p id="message"></p>
    </div>


<script src="inscriotion.js"></script>
</body>
</html>
