<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
</head>
<style>
    body{
        background-image: url(image/WhatsApp\ Image\ 2026-07-26\ at\ 11.25.18.jpeg);
    }
.contener{
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 30px;
    padding: 20px;
    
}

.ibzo{
    width: 350px;
    max-width: 90%;
    padding: 40px;
    background: rgb(247, 242, 242);
    color: #ae7979;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    text-align: center;
}

.button {
    display: inline-block;
    padding: 12px 25px;
    margin-top: 20px;
    background: linear-gradient(135deg, #28a745, #6b775e);
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    transition: 0.3s;
}

.button:hover {
    transform: translateY(-3px);
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
}
    
</style>
<body>
    <section class="contener">
        <div id="ibzo" class="ibzo">
            <h3>SE CONNECTER</h3>
            <p>Veiller saisir les information si dessous</p>
            <input type="email" id="email" placeholder="✉️Adresse email"><br><br>
            <input type="password" id="password" placeholder="🔒Mot de passe">
            <button class="button">SE CONNECTER</button>
               <p>Vous n'avait pas encore de compte?
                <a href="inscriptionp.html">Creer un compte</a>
            </p>
        </div>
       
        
    </section>
</body>
</html>
